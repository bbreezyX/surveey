<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mockup D: Gabungan</title>
<link rel="stylesheet" href="../../src/public/styles/fonts.css">
<link rel="stylesheet" href="../../src/public/styles/tokens.css">
<link rel="stylesheet" href="base.css">
<style>
/* D: Gabungan (A + B). A's "Progres" view is the way in: the province
   summary and the kabupaten atlas counted by stage. Opening a kabupaten no
   longer shows A's tile board but B's work list: units sorted by the report
   they need next, each with Lapor. The last kabupaten opened becomes "your
   wilayah" on this phone and sits above the atlas as a shortcut. */

/* ---- A: view switch ---- */
.mode {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px;
  margin: 0 16px 12px;
  padding: 3px;
  border: 1px solid var(--hairline);
  border-radius: 999px;
  background: var(--frost);
}

.mode[hidden] { display: none; }

.mode button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 34px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: 13.5px;
  font-weight: 650;
  transition: background-color var(--dur), color var(--dur), border-color var(--dur);
}

.mode button:hover { color: var(--ink); }
/* A border, not only a fill, marks the chosen half: it survives forced colours. */
.mode button[aria-selected="true"] { border-color: var(--hairline-strong); background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(20, 38, 53, 0.08); }
.mode__pct { padding: 1px 6px; border-radius: 999px; background: var(--green-tint); color: var(--green); font-size: 11.5px; font-weight: 750; font-variant-numeric: tabular-nums; }

/* ---- A: province summary ---- */
.prog-sum { padding: 2px 16px 14px; }
.prog-sum__row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.prog-total { display: flex; align-items: center; gap: 10px; margin: 0; }
.prog-total > b { font-size: 34px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; color: var(--green); font-variant-numeric: tabular-nums; }
.prog-total > span { display: flex; flex-direction: column; font-size: 13px; line-height: 1.3; }
.prog-total > span > span:first-child { font-weight: 650; }
.prog-total span b { font-weight: 750; }
.prog-pct { color: var(--muted-2); font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; }
.prog-pct b { color: var(--ink); font-size: 15px; font-weight: 750; }

.prog-legend {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 6px 14px;
  margin: 10px 0 0;
  padding: 0;
  list-style: none;
  font-size: 13px;
}

.prog-legend li { display: flex; align-items: center; gap: 7px; min-width: 0; color: var(--muted); }
.prog-legend b { margin-left: auto; color: var(--ink); font-weight: 750; font-variant-numeric: tabular-nums; }
.prog-legend--tight { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); font-size: 12.5px; }

/* ---- D: this phone's wilayah, between the summary and the atlas ---- */
.work-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 4px 12px;
  width: calc(100% - 32px);
  margin: 0 16px 14px;
  padding: 11px 12px 12px 14px;
  border: 1px solid var(--hairline-strong);
  border-radius: var(--radius-md);
  background: #fff;
  text-align: left;
  -webkit-tap-highlight-color: transparent;
  transition: border-color var(--dur), background-color var(--dur), scale var(--dur-press) var(--ease-out);
}

.work-card:hover { border-color: var(--blue); background: var(--row-hover); }
.work-card:active { scale: 0.99; }
.work-card__label { color: var(--muted); font-size: 12px; font-weight: 600; }
.work-card__name { display: flex; align-items: baseline; gap: 8px; font-size: 15.5px; font-weight: 750; line-height: 1.25; }
.work-card__name small { color: var(--muted); font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.work-card__go { grid-row: 1 / span 2; grid-column: 2; display: inline-flex; align-items: center; gap: 5px; color: var(--blue); font-size: 13px; font-weight: 700; }
.work-card__go::after { content: ""; width: 6px; height: 6px; border: solid currentColor; border-width: 1.6px 1.6px 0 0; transform: rotate(45deg); }
.work-card .dist { grid-column: 1 / -1; margin-top: 6px; }
.work-card__next { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 4px; color: var(--ink); font-size: 12.5px; font-weight: 650; }
.work-card__next span { display: inline-flex; align-items: center; gap: 5px; }
.work-card__next .is-wait { color: var(--muted); }
.work-card__next svg { width: 13px; height: 13px; }

.prog-pending {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  margin-top: 12px;
  padding: 9px 12px;
  border: 1px solid var(--hairline-strong);
  border-radius: var(--radius-sm);
  background: #fff;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
  text-align: left;
  transition: border-color var(--dur), background-color var(--dur);
}

.prog-pending:hover { border-color: var(--blue); background: var(--row-hover); }
.prog-pending svg { flex: none; width: 15px; height: 15px; }
.prog-pending b { color: var(--ink); font-weight: 750; }
.prog-pending::after { content: ""; width: 6px; height: 6px; margin-left: auto; border: solid var(--muted-2); border-width: 1.6px 1.6px 0 0; transform: rotate(45deg); }

/* ---- A: kabupaten atlas ---- */
.grid-label {
  display: flex;
  justify-content: space-between;
  margin: 0;
  padding: 10px 18px;
  border-block: 1px solid #c6d3df;
  background: var(--hairline);
  font-size: 14.5px;
  font-weight: 750;
}

.grid-label span { font-size: 13px; font-variant-numeric: tabular-nums; }

.atlas-grid { display: grid; grid-template-columns: 1fr 1fr; }

.atlas-cell {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 4px;
  min-width: 0;
  padding: 12px 14px 13px;
  border: 0;
  border-bottom: 1px solid var(--divider);
  background: #fff;
  text-align: left;
  transition: background-color var(--dur);
}

.atlas-cell:nth-child(odd) { border-right: 1px solid var(--divider); }
.atlas-cell:hover { background: var(--row-hover); }
.atlas-cell:hover .atlas-shape { fill: #d9e9f7; stroke: var(--blue); }
.atlas-cell__shape { display: block; height: 54px; margin-bottom: 4px; }
.atlas-cell__shape svg { display: block; width: 100%; height: 100%; overflow: visible; }
.atlas-cell__name { display: flex; align-items: center; gap: 6px; font-size: 14.5px; font-weight: 700; line-height: 1.25; }
.atlas-cell__mine { padding: 1px 6px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 10.5px; font-weight: 700; }
.atlas-cell__meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.atlas-cell__meta b { color: var(--ink); font-weight: 750; }
.atlas-cell__meta.is-done, .atlas-cell__meta.is-done b { color: var(--green); font-weight: 700; }
.atlas-cell .dist { margin: 2px 0 1px; }
.atlas-cell__rest { display: flex; flex-wrap: wrap; gap: 2px 8px; color: var(--ink); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.atlas-cell__rest span { display: inline-flex; align-items: center; gap: 3px; }
.atlas-cell__rest .badge { width: 12px; height: 12px; }
.atlas-cell__rest .is-none { color: var(--muted); font-weight: 600; }

.atlas-dot { fill: var(--yellow); stroke: var(--ink); stroke-width: 0.8; vector-effect: non-scaling-stroke; }
.status-flag { display: inline-flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 12px; font-weight: 600; line-height: 1.3; }
.status-flag::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: 50%; }
.status-flag--duplikat { color: var(--orange-deep); }
.status-flag--duplikat::before { border: 2px solid var(--orange); background: var(--yellow); }
.status-flag--belum { color: var(--muted); }
.status-flag--belum::before { border: 1.5px dashed var(--muted-2); background: #fff; }

/* ---- B: one kabupaten as a work list ---- */
.region-sum { padding: 0 16px 12px; }

.mine {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 16px 12px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  background: var(--green-tint);
  color: var(--muted-2);
  font-size: 12.5px;
  line-height: 1.3;
}

.mine svg { flex: none; }
.mine strong { display: block; color: var(--green); font-size: 13px; font-weight: 700; }
.mine.is-pending { background: var(--frost); box-shadow: inset 0 0 0 1px var(--hairline); }
.mine.is-pending strong { color: var(--ink); }

.todo { border-top: 1px solid var(--divider); }

.todo summary {
  position: sticky;
  top: 0;
  z-index: 1;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 10px;
  padding: 12px 16px 12px 18px;
  background: #fff;
  cursor: pointer;
  list-style: none;
  transition: background-color var(--dur);
}

.todo summary::-webkit-details-marker { display: none; }
.todo summary:hover { background: var(--row-hover); }
.todo[open] summary { border-bottom: 1px solid var(--divider); }
.todo summary .badge { width: 18px; height: 18px; }
.todo__title { display: block; font-size: 14.5px; font-weight: 750; line-height: 1.25; }
.todo__sub { display: block; color: var(--muted); font-size: 12.5px; font-weight: 500; }
.todo__count { min-width: 30px; padding: 2px 8px; border-radius: 999px; background: var(--frost); box-shadow: inset 0 0 0 1px var(--hairline); color: var(--ink); font-size: 13px; font-weight: 750; text-align: center; font-variant-numeric: tabular-nums; }
.todo.is-next .todo__count { background: var(--ink); box-shadow: none; color: #fff; }
.todo.is-done .todo__count { background: var(--green-tint); box-shadow: none; color: var(--green); }
.todo summary::after { content: ""; width: 7px; height: 7px; margin: 0 4px 3px 2px; border: solid var(--muted-2); border-width: 0 1.8px 1.8px 0; transform: rotate(45deg); transition: transform var(--dur) var(--ease-out); }
.todo[open] summary::after { transform: translate(0, 3px) rotate(-135deg); }
.todo__empty { margin: 0; padding: 4px 18px 14px; color: var(--muted); font-size: 13px; }

.desa-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 10px 16px 4px 18px; border-bottom: 1px solid var(--divider); background: var(--frost); }
.desa-head b { font-size: 13.5px; font-weight: 700; }
.desa-head span { flex: none; color: var(--muted); font-size: 12px; font-weight: 600; }

.job { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 56px; padding: 8px 16px 8px 18px; border-bottom: 1px solid var(--divider); }
.job__text { display: grid; gap: 3px; min-width: 0; }
.job__text small { overflow: hidden; color: var(--muted); font-size: 12px; white-space: nowrap; text-overflow: ellipsis; }
.job__text .stage-pill { justify-self: start; }
.job__done { color: var(--green); font-size: 12px; font-weight: 700; }

@media (max-width: 959px) {
  .prog-legend { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<svg class="map" id="map" role="img" aria-label="Latar peta (disederhanakan untuk mockup)"></svg>
<div class="masthead" aria-hidden="true"><img src="../../src/public/assets/lambang-jambi-60.webp" alt=""><span><small>Dinas ESDM Provinsi Jambi</small><b>Sebaran PUTS 2026</b></span></div>
<div class="map-chip map-chip--layers" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5Zm-9 9 9 5 9-5m-18 5 9 5 9-5"/></svg></div>
<div class="map-legend" id="legend" aria-hidden="true"></div>
<div class="map-zoom" aria-hidden="true"><span>−</span><span>+</span></div>

<aside class="sidebar" id="sidebar" aria-label="Daftar titik PUTS">
  <button class="sheet-handle" type="button" aria-label="Tutup daftar titik"><i></i><span>Tutup Daftar Titik</span></button>
  <div id="top"></div>
  <div class="mode" focusgroup="tablist nomemory" aria-label="Tampilan daftar">
    <button type="button" id="tab-sebaran" aria-selected="false">Sebaran</button>
    <button type="button" id="tab-progres" aria-selected="true" focusgroupstart>Progres <span class="mode__pct" id="pct"></span></button>
  </div>
  <div class="panel-scroll" id="scroll"><div class="panel-screen" id="screen" role="tabpanel" aria-labelledby="tab-progres"></div></div>
  <p class="sidebar-footer"><span class="sidebar-footer__title">Hanya tahap yang sudah diterima yang dihitung</span><span class="sidebar-footer__meta" id="foot"></span></p>
</aside>

<script src="data.js"></script>
<script src="mock.js"></script>
<script>
(function () {
  "use strict";
  var K = window.Mock, M = K.data, esc = K.esc;
  var sidebar = document.getElementById("sidebar"), top = document.getElementById("top"), screen = document.getElementById("screen"), scroll = document.getElementById("scroll"), mapEl = document.getElementById("map");
  var tabs = [document.getElementById("tab-sebaran"), document.getElementById("tab-progres")];
  var KEY = "mock-survey-wilayah-kerja";
  var all = K.tally(M.units);

  // The wilayah this phone last worked in; private windows start on the mockup's default.
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) { /* storage blocked */ }
  var state = { mode: "progres", region: null, mine: M.order.indexOf(saved) >= 0 ? saved : "Batanghari", openPending: false };

  K.switcher("d-gabungan.html");
  K.map(mapEl);
  document.getElementById("pct").textContent = all.pct + "%";
  document.getElementById("foot").textContent = "Progres dari esdm.cloud · " + M.taken;
  document.getElementById("legend").innerHTML = [1, 2, 3, 4].map(function (s) { return "<span>" + K.badge(s) + (s === 4 ? "Terpasang" : K.STAGES[s - 1]) + "</span>"; }).join("") + '<span><i class="dot dot--belum"></i>Belum Ditetapkan</span><span><i class="dot dot--duplikat"></i>Perlu Konfirmasi</span>';

  var ICON_COLLAPSE = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15M16 10l-2 2 2 2"/></svg>';
  var ICON_BACK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 6-6 6 6 6"/></svg>';
  var ICON_CAMERA = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg>';
  var ICON_WAIT = '<svg viewBox="0 0 14 14" width="22" height="22" aria-hidden="true" style="color:var(--muted)"><circle cx="7" cy="7" r="5.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7 4.2V7l1.9 1.3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var TICK = '<svg viewBox="0 0 28 28" width="24" height="24" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="#fff" stroke="#1f8f4e" stroke-width="2"/><path d="M8.8 14.4 12.4 17.9 19.4 10.6" fill="none" stroke="#1f8f4e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // Next report due, by accepted stage: 0 needs Galian, 1 Cor, 2 Tiang, 3 Lampu (the night photo).
  var GROUPS = [
    { stage: 0, title: "Lapor Galian", short: "lapor Galian", sub: "Belum ada tahap diterima" },
    { stage: 1, title: "Lapor Cor", short: "lapor Cor", sub: "Galian sudah diterima" },
    { stage: 2, title: "Lapor Tiang", short: "lapor Tiang", sub: "Cor sudah diterima" },
    { stage: 3, title: "Lapor Lampu", short: "lapor Lampu", sub: "Tiang terpasang, menunggu foto malam" },
  ];

  function due(units, stage) { return units.filter(function (u) { return u.s === stage && !u.p.length; }); }

  function legend(t, cls) {
    return '<ul class="prog-legend' + (cls ? " " + cls : "") + '">' + [4, 3, 2, 1, 0].map(function (s) {
      return "<li>" + K.badge(s) + "<span>" + K.STAGE_ROW[s] + "</span><b>" + t.s[s] + "</b></li>";
    }).join("") + "</ul>";
  }

  function rest(t) {
    if (t.s[4] === t.total) return "";
    if (t.s[0] === t.total) return '<span class="atlas-cell__rest"><span class="is-none">' + K.badge(0) + "Belum dimulai</span></span>";
    return '<span class="atlas-cell__rest">' + [3, 2, 1, 0].filter(function (s) { return t.s[s]; }).map(function (s) {
      return '<span title="' + K.STAGE_ROW[s] + '">' + K.badge(s) + t.s[s] + "</span>";
    }).join("") + "</span>";
  }

  function head() {
    if (!state.region) {
      top.innerHTML = '<div class="atlas-head"><img src="../../src/public/assets/lambang-jambi-76.webp" alt="Lambang Provinsi Jambi" width="38" height="39"><div><p class="atlas-head__org">Dinas ESDM Provinsi Jambi</p><h1 class="atlas-head__title">Sebaran PUTS 2026</h1></div><button class="panel-collapse" type="button" aria-label="Sembunyikan daftar">' + ICON_COLLAPSE + "</button></div>";
      return;
    }
    var t = K.tally(K.unitsOf(state.region));
    top.innerHTML = '<div class="atlas-detail"><div class="atlas-detail__bar"><button class="atlas-back" type="button" data-back aria-label="Kembali ke semua wilayah">' + ICON_BACK + '<span>Semua Wilayah</span></button><button class="panel-collapse" type="button" aria-label="Sembunyikan daftar">' + ICON_COLLAPSE + '</button></div><div class="atlas-detail__main"><div><h1>' + esc(state.region) + "</h1><p><b>" + t.s[4] + "</b> dari <b>" + t.total + "</b> titik terpasang</p></div>" + '<div class="atlas-locator" role="img" aria-label="Letak ' + esc(state.region) + ' di Provinsi Jambi">' + K.locator(state.region) + "</div></div></div>";
  }

  // This phone's wilayah: progress plus what is due next, one tap from the atlas.
  function workCard() {
    var units = K.official(K.unitsOf(state.mine)), t = K.tally(units);
    var next = GROUPS.map(function (g) { return { g: g, n: due(units, g.stage).length }; }).filter(function (x) { return x.n; });
    var lines = next.slice(0, 2).map(function (x) { return "<span>" + K.badge(x.g.stage) + x.n + " " + x.g.short + "</span>"; });
    if (t.pending.length) lines.push('<span class="is-wait">' + K.CLOCK + t.pending.length + " menunggu</span>");
    if (!lines.length) lines.push("<span>" + K.badge(4) + "Semua terpasang</span>");
    return '<button class="work-card" type="button" data-region="' + esc(state.mine) + '"><span class="work-card__label">Wilayah kerjamu</span><span class="work-card__go">Buka</span><span class="work-card__name">' + esc(state.mine) + "<small>" + t.s[4] + "/" + t.total + " terpasang</small></span>" + K.dist(t, true) + '<span class="work-card__next">' + lines.join("") + "</span></button>";
  }

  function provinceScreen() {
    var cells = M.order.map(function (name) {
      var t = K.tally(K.unitsOf(name)), done = t.s[4] === t.total;
      var label = [name, t.s[4] + " dari " + t.total + " terpasang"].concat([3, 2, 1, 0].filter(function (s) { return t.s[s]; }).map(function (s) { return t.s[s] + " " + K.STAGE_ROW[s].toLowerCase(); })).join(", ");
      return '<button class="atlas-cell" type="button" data-region="' + esc(name) + '" aria-label="' + esc(label + (name === state.mine ? ", wilayah kerjamu" : "")) + ', buka">' +
        '<span class="atlas-cell__shape">' + K.thumb(name) + "</span>" +
        '<span class="atlas-cell__name">' + esc(name) + (name === state.mine ? '<span class="atlas-cell__mine" aria-hidden="true">Wilayahmu</span>' : "") + "</span>" +
        '<span class="atlas-cell__meta' + (done ? " is-done" : "") + '">' + (done ? "Semua terpasang · " + t.total : "<b>" + t.s[4] + "</b>/" + t.total + " terpasang") + "</span>" +
        K.dist(t, true) + rest(t) + "</button>";
    }).join("");
    var pending = all.pending.length ? '<button class="prog-pending" type="button" data-pending>' + K.CLOCK + "<span><b>" + all.pending.length + " laporan</b> menunggu diperiksa</span></button>" : "";
    return '<section class="prog-sum" aria-label="Ringkasan progres provinsi"><div class="prog-sum__row"><p class="prog-total" role="status"><b>' + all.s[4] + "</b><span><span>Titik Terpasang</span><span>dari <b>" + all.total + '</b> titik PUTS</span></span></p><span class="prog-pct"><b>' + all.pct + "%</b> selesai</span></div>" + K.dist(all) + legend(all) + pending + "</section>" +
      workCard() + '<p class="grid-label" role="heading" aria-level="2">Semua Wilayah<span>' + M.order.length + ' kabupaten/kota</span></p><div class="atlas-grid">' + cells + "</div>";
  }

  // B's rows: grouped under the allocation line, coordinate under the code, a pill only for an open report.
  function rows(list, done) {
    var groups = {};
    list.forEach(function (u) { var k = u.r + "|" + u.kec; (groups[k] = groups[k] || []).push(u); });
    return Object.keys(groups).map(function (k) {
      var items = groups[k], parts = k.split("|");
      return '<div class="desa-head"><b>' + esc(parts[0].replace(/, Kec\. .*$/, "")) + "</b><span>Kec. " + esc(parts[1]) + "</span></div>" + items.map(function (u) {
        var pend = u.p.length ? '<span class="stage-pill is-pending">' + K.CLOCK + K.STAGES[u.p[u.p.length - 1] - 1] + " Menunggu</span>" : "";
        return '<div class="job"><span class="atlas-unit' + (u.f ? " is-" + u.f : "") + '">' + esc(u.c) + '</span><span class="job__text">' + pend + '<small class="num">' + (u.f === "belum" ? "Belum ada koordinat" : esc(u.ll)) + "</small></span>" +
          (done ? '<span class="job__done">Selesai</span>' : '<a class="lapor" href="#" data-lapor="' + esc(u.c + " " + u.desa) + '" aria-label="Lapor titik ' + esc(u.c + " " + u.desa) + '">' + ICON_CAMERA + "Lapor</a>") + "</div>";
      }).join("");
    }).join("");
  }

  function regionScreen() {
    var units = K.official(K.unitsOf(state.region)), t = K.tally(units);
    var firstOpen = state.openPending ? null : GROUPS.find(function (g) { return due(units, g.stage).length; });
    var mine = units.find(function (u) { return u.p.length; }) || units.find(function (u) { return u.s >= 1; });
    var html = '<div class="region-sum">' + K.dist(t) + legend(t, "prog-legend--tight") + "</div>";
    if (mine) {
      var pending = mine.p.length;
      html += '<p class="mine' + (pending ? " is-pending" : "") + '">' + (pending ? ICON_WAIT : TICK) + "<span><strong>Laporan " + K.STAGES[(pending ? mine.p[mine.p.length - 1] : mine.s) - 1] + " titik " + esc(mine.c) + " " + esc(mine.desa) + "</strong>Dikirim dari HP ini · " + (pending ? "Menunggu diperiksa" : "Sudah diterima") + "</span></p>";
    }
    GROUPS.forEach(function (g) {
      var list = due(units, g.stage);
      if (!list.length) return; // An empty step is already a zero in the legend above.
      var open = g === firstOpen;
      html += '<details class="todo' + (open ? " is-next" : "") + '"' + (open ? " open" : "") + "><summary>" + K.badge(g.stage) + '<span><span class="todo__title">' + g.title + '</span><span class="todo__sub">' + g.sub + '</span></span><span class="todo__count">' + list.length + "</span></summary>" + rows(list) + "</details>";
    });
    if (t.pending.length) html += '<details class="todo"' + (state.openPending ? " open" : "") + '><summary><svg class="badge" viewBox="0 0 14 14" aria-hidden="true" style="color:var(--muted)"><circle cx="7" cy="7" r="5.6" fill="#fff" stroke="currentColor" stroke-width="1.4"/><path d="M7 4.2V7l1.9 1.3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span><span class="todo__title">Menunggu Diperiksa</span><span class="todo__sub">Sudah dikirim, belum diterima kantor</span></span><span class="todo__count">' + t.pending.length + "</span></summary>" + rows(t.pending) + "</details>";
    var done = units.filter(function (u) { return u.s >= 4; });
    html += '<details class="todo is-done"><summary>' + K.badge(4) + '<span><span class="todo__title">Terpasang</span><span class="todo__sub">Lampu menyala, semua tahap diterima</span></span><span class="todo__count">' + done.length + "</span></summary>" + (done.length ? rows(done, true) : '<p class="todo__empty">Belum ada titik terpasang.</p>') + "</details>";
    return html;
  }

  // Today's "Sebaran" atlas, unchanged, so the switch shows what it sits beside.
  function sebaranScreen() {
    return '<div class="atlas-grid">' + M.order.map(function (name) {
      var units = K.official(K.unitsOf(name)), kec = new Set(units.map(function (u) { return u.kec; })).size;
      var dup = units.filter(function (u) { return u.f === "duplikat"; }).length, bel = units.filter(function (u) { return u.f === "belum"; }).length;
      return '<button class="atlas-cell" type="button"><span class="atlas-cell__shape">' + K.thumb(name).replace(/class="prog-dot s\d"/g, 'class="atlas-dot"') + '</span><span class="atlas-cell__name">' + esc(name) + '</span><span class="atlas-cell__meta"><b>' + units.length + "</b> titik di " + kec + " kecamatan</span>" + (dup ? '<span class="status-flag status-flag--duplikat">' + dup + " perlu konfirmasi</span>" : "") + (bel ? '<span class="status-flag status-flag--belum">' + bel + " belum ditetapkan</span>" : "") + "</button>";
    }).join("") + "</div>";
  }

  function render(dir) {
    head();
    tabs.forEach(function (tab) { var on = tab.id === "tab-" + state.mode; tab.setAttribute("aria-selected", on); tab.toggleAttribute("focusgroupstart", on); });
    screen.setAttribute("aria-labelledby", "tab-" + state.mode);
    screen.innerHTML = state.mode === "sebaran" ? sebaranScreen() : state.region ? regionScreen() : provinceScreen();
    document.querySelector(".mode").hidden = !!state.region;
    if (dir) { scroll.scrollTop = 0; K.enter(sidebar, dir); K.map(mapEl, state.region); }
  }

  function openRegion(name, pending) {
    state.region = name;
    state.mine = name;
    state.openPending = !!pending;
    try { localStorage.setItem(KEY, name); } catch (e) { /* storage blocked */ }
    render("fwd");
    top.querySelector("[data-back]").focus({ preventScroll: true });
  }

  sidebar.addEventListener("click", function (event) {
    var el = event.target.closest("button");
    if (!el) return;
    if (el.hasAttribute("data-region")) openRegion(el.getAttribute("data-region"));
    else if (el.hasAttribute("data-back")) { var from = state.region; state.region = null; render("back"); var cell = screen.querySelector('.atlas-cell[data-region="' + from + '"]'); if (cell) cell.focus({ preventScroll: true }); }
    else if (el.hasAttribute("data-pending")) openRegion(all.pending[0].k, true);
    else if (el.id === "tab-sebaran" || el.id === "tab-progres") { var mode = el.id.slice(4); if (mode !== state.mode) { state.mode = mode; state.region = null; render(mode === "progres" ? "fwd" : "back"); } }
  });

  // focusgroup gives the tablist its arrow keys natively; elsewhere a small stand-in does the same two-tab job.
  if (!Object.prototype.hasOwnProperty.call(HTMLElement.prototype, "focusGroup")) {
    var modeEl = document.querySelector(".mode");
    modeEl.setAttribute("role", "tablist");
    tabs.forEach(function (tab) { tab.setAttribute("role", "tab"); });
    modeEl.addEventListener("keydown", function (event) {
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      var next = tabs[(tabs.indexOf(document.activeElement) + 1) % 2];
      next.focus(); next.click();
    });
    var sync = function () { tabs.forEach(function (tab) { tab.tabIndex = tab.getAttribute("aria-selected") === "true" ? 0 : -1; }); };
    new MutationObserver(sync).observe(modeEl, { attributes: true, subtree: true, attributeFilter: ["aria-selected"] });
    sync();
  }

  render();
})();
</script>
</body>
</html>
